[package]
name = "sentinel-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
thiserror = "1"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true

rusqlite = { version = "0.31", features = ["bundled"] }
# Inspeção de certificado TLS. Opcional (feature tls-inspect): em ambiente onde
# não se queira TLS, compila-se sem. tokio-rustls usa rustls, que com a feature
# `ring` é Rust puro e não precisa de compilador C nem de OpenSSL do sistema.
x509-parser = "0.16"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
pnet = { version = "0.35", optional = true }
ipnet = "2"
# Listagem de interfaces sem libpcap: usa getifaddrs no Unix e
# GetAdaptersAddresses no Windows. Precisa funcionar mesmo em modo limitado,
# senão a interface não tem o que oferecer e o botão de escanear fica inerte.
if-addrs = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
# DNS reverso. Cliente de DNS em Rust puro, sem depender do resolver do
# sistema em C.
hickory-resolver = "0.24"
toml = "0.8"
regex = "1"
# SHA-256 para o selo de evidência. Implementação em Rust puro, sem C.
sha2 = "0.10"
# Timestamp legível no manifesto de evidência (ISO 8601 com fuso).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }


[features]
default = ["raw-socket", "tls-inspect"]
# Isola tudo que exige socket raw. Build sem este recurso compila em ambiente
# sem libpcap e funciona em modo limitado, o que é útil em CI.
raw-socket = ["pnet"]
tls-inspect = ["tokio-rustls", "rustls"]